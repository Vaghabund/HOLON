<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HOLON — PDF Viewer</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <a class="experience-home-link" href="index.html" aria-label="Back to menu">Menu</a>

        <div class="pdf-viewer-container">
            <div class="pdf-scroll-container" id="pdfScrollContainer">
                <!-- PDF pages will be rendered here -->
            </div>

            <div class="pdf-controls">
                <button id="prevBtn" class="nav-arrow">‹</button>
                <div class="dots-container" id="dotsContainer">
                    <!-- Dots will be generated by JS -->
                </div>
                <button id="nextBtn" class="nav-arrow">›</button>
            </div>
        </div>

        <script type="module" src="script.js"></script>
    </body>
</html>
